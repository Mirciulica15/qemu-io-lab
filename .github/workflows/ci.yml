name: CI

# Trunk-based: build on every push to main. A v* tag additionally packages
# and publishes the student kit. Heavy work runs only after lint passes.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast static checks — no QEMU, no network. Reproduce locally with `act -j lint`.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck builder/*.sh ./*.sh kit/run.sh

      - name: Install ruff + yamllint
        run: pipx install ruff && pipx install yamllint

      - name: ruff (lint + format check)
        run: |
          ruff check builder/*.py
          ruff format --check builder/*.py

      - name: py_compile
        run: python3 -m py_compile builder/*.py

      - name: yamllint (workflow files)
        run: yamllint -c .yamllint.yml .github/workflows

      - name: Install actionlint
        run: |
          curl -fsSL -o /tmp/download-actionlint.bash \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash
          bash /tmp/download-actionlint.bash 1.7.12

      - name: actionlint
        run: ./actionlint -color

  # The reproducibility gate: build the image from scratch under TCG and run
  # check.sh inside it (builder/verify.py). On a v* tag, also package + release.
  # Body is a thin wrapper over committed scripts — run them locally to test.
  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write              # only exercised on tags, to create the release
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils

      - name: Cache Alpine ISO
        id: iso-cache
        uses: actions/cache@v4
        with:
          path: alpine-virt-3.21.0-x86_64.iso
          key: alpine-iso-3.21.0

      - name: Download Alpine ISO
        if: steps.iso-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o alpine-virt-3.21.0-x86_64.iso \
            https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/x86_64/alpine-virt-3.21.0-x86_64.iso

      # build-image.sh verifies the ISO against the pinned ISO_SHA256, builds the
      # image, then runs verify.py (boots it, runs check.sh, fails on any [FAIL]).
      - name: Build and verify image
        run: ./builder/build-image.sh

      # ---- release: tags only ----
      - name: Install packaging tools
        if: startsWith(github.ref, 'refs/tags/v')
        run: sudo apt-get install -y --no-install-recommends xorriso zip

      - name: Package student kit
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./package.sh

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" iolab-student-kit.zip --generate-notes

      - name: Upload student kit (consumed by windows-smoke)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: student-kit
          path: iolab-student-kit.zip
          retention-days: 1

  # Smoke-test the Windows launcher (run.bat) on a real Windows runner — tags only.
  # The image is platform-independent and already verified on Linux (build) and macOS;
  # this exercises the Windows-specific surface: run.bat under cmd.exe (CRLF + the ^
  # line-continuations) and QEMU-for-Windows accepting the device set — by booting the
  # shipped kit headless and asserting it reaches the auto-login root shell.
  windows-smoke:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Download student kit
        uses: actions/download-artifact@v4
        with:
          name: student-kit

      - name: Install QEMU
        run: choco install qemu -y --no-progress

      - name: Unzip kit
        shell: pwsh
        run: Expand-Archive -Path iolab-student-kit.zip -DestinationPath kit

      - name: Boot via run.bat and assert auto-login (headless, TCG)
        shell: pwsh
        run: |
          $env:Path += ';C:\Program Files\qemu'
          Set-Location kit
          $p = Start-Process -FilePath cmd.exe -ArgumentList '/c run.bat' `
                 -RedirectStandardOutput serial.log -RedirectStandardError serr.log `
                 -PassThru -NoNewWindow
          Start-Sleep -Seconds 360
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Content serial.log -Tail 30
          if (Select-String -Path serial.log -Pattern ':~#|login:') {
            Write-Host 'PASS: run.bat booted the VM to an auto-login root shell on Windows.'
          } else {
            Write-Error 'FAIL: VM never reached the login prompt via run.bat.'
            exit 1
          }
